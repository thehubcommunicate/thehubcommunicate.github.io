<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>THE HUB</title>
    <script type="text/javascript">
      // For HashRouter on root domain, redirect any path to the hash version
      var l = window.location;
      if (l.pathname !== '/') {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/#' + l.pathname);
      }
    </script>
  </head>
  <body>
  </body>
</html>
